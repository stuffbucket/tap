<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tap Player</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #090a0f; color: #e8eaf2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    header { height: 54px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #12131b; border-bottom: 1px solid #2b2e3b; }
    button, select { background: #222533; color: #f5f6fa; border: 1px solid #3a3e50; border-radius: 7px; padding: 7px 11px; font: inherit; }
    button:hover { background: #303449; }
    #seek { flex: 1; accent-color: #8b9cff; }
    #time { min-width: 116px; color: #aeb4c8; font-variant-numeric: tabular-nums; }
    #fps { min-width: 118px; color: #8992aa; font: 12px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    #stage-wrap { display: grid; place-items: center; min-height: 0; padding: 16px; }
    #stage { position: relative; overflow: hidden; transform-origin: center; box-shadow: 0 18px 70px #000b; }
    .pane { position: absolute; overflow: hidden; background: #1a1b26; border: 1px solid #2f3241; }
    .pane-host { width: 100%; height: 100%; overflow: hidden; transform-origin: top left; }
    .pane canvas { display: block; }
    #native-frame { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
    #menu { position: fixed; z-index: 20; display: none; min-width: 190px; padding: 6px; background: #1a1c26; border: 1px solid #41465c; border-radius: 9px; box-shadow: 0 12px 40px #000a; }
    #menu button { width: 100%; border: 0; text-align: left; background: transparent; }
    #menu button:hover { background: #2d3144; }
    #toast { position: fixed; right: 16px; bottom: 16px; opacity: 0; transition: opacity .15s; background: #202432; padding: 9px 13px; border-radius: 8px; }
    #keystrokes { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); min-width: 90px; max-width: 70vw; padding: 8px 14px; border-radius: 9px; background: #0b0c12d9; border: 1px solid #444a61; text-align: center; font: 600 18px ui-monospace, monospace; opacity: 0; transition: opacity .12s; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0.000 / 0.000</span>
    <span id="fps">0 fps</span>
    <select id="speed" aria-label="Playback speed"><option>.25×</option><option>.5×</option><option selected>1×</option><option>2×</option><option>4×</option></select>
    <button id="renderer">Native pixels</button>
    <button id="show-input">Keys off</button>
    <button id="save">Save edits</button>
    <button id="download">Download</button>
  </header>
  <main id="stage-wrap"><section id="stage"><img id="native-frame" alt="Native libghostty-vt frame"></section></main>
  <nav id="menu">
    <button data-action="play">Play / pause</button>
    <button data-action="copy">Copy selection</button>
    <button data-action="marker">Add marker here</button>
    <button data-action="toggle">Hide / show pane</button>
    <button data-action="tile-horizontal">Tile panes horizontally</button>
    <button data-action="tile-vertical">Tile panes vertically</button>
    <button data-action="resize">Resize terminal…</button>
    <button data-action="download">Download project</button>
  </nav>
  <div id="toast"></div>
  <div id="keystrokes" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
