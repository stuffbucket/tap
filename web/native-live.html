<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tap Native Live</title><style>:root{color-scheme:dark;font-family:system-ui;background:#090a0f;color:#eef}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:48px 1fr}header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:#141620}button{background:#242838;color:white;border:1px solid #46506a;border-radius:7px;padding:7px 11px}#stage{position:relative;overflow:hidden}.pane{position:absolute;background:#1a1b26;border:1px solid #3b4255;overflow:hidden}.pane.focused{border-color:#7aa2f7}.host{width:100%;height:100%}#menu{display:none;position:fixed;z-index:20;background:#1b1e2a;border:1px solid #46506a;border-radius:8px;padding:6px}#menu button{display:block;width:100%;border:0;text-align:left;background:transparent}#menu button:hover{background:#30364a}</style></head><body><header><strong>Tap native panes</strong><span id="status">recording</span><button id="stop">Stop &amp; save</button></header><main id="stage"></main><nav id="menu"><button data-action="vertical">Split right</button><button data-action="horizontal">Split down</button><button data-action="focus">Focus pane</button><button data-action="close">Close pane</button></nav><script type="module" src="/native-live.js"></script></body></html>
