# Rust pin for crates/. Run cargo through mise so no global Rust default is
# needed: `mise x rust@1.99.0 zig@0.17.1 -- cargo test` (Zig builds
# libghostty-vt for crates/tap-index). Keep this channel and that version
# together.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
